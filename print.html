<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borang Permohonan</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#e9ecf2;color:#1a1a1a;font-family:Arial,Helvetica,sans-serif;font-size:13px;padding:24px 12px;}
    .toolbar{max-width:794px;margin:0 auto 14px;display:flex;gap:8px;justify-content:flex-end;}
    .toolbar button,.toolbar a{background:#0F6E6A;color:#fff;border:none;padding:9px 18px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;}
    .toolbar a{background:#fff;color:#0F6E6A;border:1px solid #0F6E6A;}
    .sheet{max-width:794px;margin:0 auto;background:#fff;padding:36px 44px;box-shadow:0 4px 18px rgba(0,0,0,.12);}
    .head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0F6E6A;padding-bottom:12px;margin-bottom:18px;}
    .head img{width:52px;height:52px;object-fit:contain;}
    .head .org{font-size:12px;color:#555;text-transform:uppercase;letter-spacing:.06em;}
    .head h1{font-size:18px;margin-top:2px;}
    .meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px;font-size:12.5px;}
    .meta b{font-size:15px;}
    .status{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;font-size:11.5px;text-transform:uppercase;border:1.5px solid currentColor;}
    .s-Diluluskan{color:#1e7b34;} .s-Ditolak{color:#b42318;} .s-Menunggu{color:#8a5a00;} .s-Dibatalkan{color:#666;}
    h2{font-size:12.5px;background:#0F6E6A;color:#fff;padding:6px 10px;margin:16px 0 0;text-transform:uppercase;letter-spacing:.05em;}
    table{width:100%;border-collapse:collapse;}
    td{border:1px solid #c9ced8;padding:7px 10px;vertical-align:top;}
    td.k{width:200px;background:#f3f5f9;font-weight:700;color:#333;}
    table.lulus th{border:1px solid #c9ced8;background:#f3f5f9;padding:6px 8px;text-align:left;font-size:11.5px;}
    table.lulus td{font-size:12px;}
    .k-Diluluskan{color:#1e7b34;font-weight:700;} .k-Ditolak{color:#b42318;font-weight:700;} .k-Belum{color:#888;}
    .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;}
    .sign div{border-top:1px solid #333;padding-top:6px;font-size:12px;color:#444;}
    .foot{margin-top:28px;font-size:10.5px;color:#888;text-align:center;}
    .msg{text-align:center;padding:60px 20px;color:#555;}
    @media print{
      body{background:#fff;padding:0;}
      .toolbar{display:none;}
      .sheet{box-shadow:none;max-width:none;padding:0;}
      @page{size:A4;margin:16mm;}
    }
    @media(max-width:600px){ .sheet{padding:20px 16px;} td.k{width:120px;} .sign{gap:20px;} }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html" onclick="if (history.length > 1) { history.back(); return false; }">&larr; Kembali</a>
    <button onclick="window.print()">Cetak / Simpan PDF</button>
  </div>
  <div class="sheet" id="root"><div class="msg">Memuatkan borang...</div></div>

  <script>
    // ====================== KONFIGURASI - WAJIB TUKAR ======================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyEwpuhwYUSzjXIXdtzObAGg1aG1QZt_wypu5b6EzTmMeNBwEvjF7iN7jtU-CWqvmVoJg/exec';
    // =========================================================================

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function jadual(rows) {
      return '<table>' + rows.map(function (r) {
        return '<tr><td class="k">' + esc(r[0]) + '</td><td>' + (r[1] === '' || r[1] === null || r[1] === undefined ? '&nbsp;' : esc(r[1])) + '</td></tr>';
      }).join('') + '</table>';
    }

    async function muat() {
      var root = document.getElementById('root');
      var id = new URL(location.href).searchParams.get('id') || '';
      if (!id) { root.innerHTML = '<div class="msg"><h3>No. rujukan tiada</h3></div>'; return; }
      try {
        if (API_URL.indexOf('GANTI') === 0) throw new Error('API_URL belum ditetapkan dalam print.html.');
        var url = new URL(API_URL); url.searchParams.set('action', 'getPrintView'); url.searchParams.set('id', id);
        var json = await (await fetch(url.toString())).json();
        if (!json.success) throw new Error(json.error || 'Ralat');
        lukis(json.data);
      } catch (e) { root.innerHTML = '<div class="msg"><h3>Ralat</h3><p>' + esc(e.message) + '</p></div>'; }
    }

    function lukis(b) {
      var root = document.getElementById('root');
      if (!b || !b.found) { root.innerHTML = '<div class="msg"><h3>Borang tidak dijumpai</h3><p>No. rujukan ini tidak sah.</p></div>'; return; }
      var hotel = b.jenis === 'Hotel';
      document.title = 'Borang ' + b.jenis + ' ' + b.id;
      var butiran = hotel ? [
        ['Daerah / destinasi', b.daerah], ['Nama hotel', b.namaHotel],
        ['Tarikh masuk', b.tarikhMasuk], ['Tarikh keluar', b.tarikhKeluar], ['Tempoh', b.bilMalam ? (Number(b.bilMalam) + 1) + ' hari ' + b.bilMalam + ' malam' : '']
      ] : [
        ['Dari', b.dari], ['Destinasi', b.destinasi],
        ['Tarikh pergi', b.tarikhPergi], ['Masa bertolak (pergi)', b.masaPergi], ['No. penerbangan (pergi)', b.noPergi],
        ['Tarikh balik', b.tarikhBalik], ['Masa bertolak (balik)', b.masaBalik], ['No. penerbangan (balik)', b.noBalik],
        ['Syarikat penerbangan', b.syarikat], ['Kelas', b.kelas]
      ];
      var skimGred = !b.skim ? '' : b.skim === 'PSH' ? 'PSH' + (b.akademik ? ' (' + b.akademik + ')' : '')
        : b.skim === 'VU' ? 'VU' : (b.skim === 'SSM' || b.skim === 'SSPA') ? b.skim + ' ' + (b.gred || '') : b.skim + (b.gred || '');
      var keputusan = [['Status', b.status + (b.peringkat ? ' (peringkat ' + b.peringkat + '/' + b.jumlahPeringkat + ': ' + b.pelulusSemasa + ')' : '')]];
      if (hotel) keputusan.push(['Kelayakan sewa hotel', b.status === 'Diluluskan' ? b.hadKelayakan : '']);
      keputusan.push(['Catatan', b.catatanAdmin], ['Tarikh keputusan', b.tarikhKeputusan]);
      // Hotel: jadual kelulusan 4 peringkat
      var kel = (b.kelulusan || []);
      var jadualLulus = !kel.length ? '' :
        '<table class="lulus" style="margin-top:-1px;"><tr><th style="width:32px;">#</th><th>Pelulus</th><th style="width:110px;">Keputusan</th><th>Catatan</th><th style="width:120px;">Tarikh</th></tr>' +
        kel.map(function (k) {
          var kp = k.keputusan || 'Belum';
          return '<tr><td>' + k.peringkat + '</td><td><b>' + esc(k.jawatan) + '</b>' + (k.nama ? '<br>' + esc(k.nama) : '') + '</td>' +
            '<td class="k-' + esc(kp) + '">' + esc(kp) + '</td><td>' + (esc(k.catatan) || '&nbsp;') + '</td><td>' + (esc(k.tarikh) || '&nbsp;') + '</td></tr>';
        }).join('') + '</table>';

      root.innerHTML =
        '<div class="head"><img src="logo.png" alt=""><div><div class="org">' + esc(b.organisasi) + '</div>' +
        '<h1>Borang Permohonan ' + (hotel ? 'Penginapan Hotel' : 'Tiket Penerbangan') + '</h1></div></div>' +
        '<div class="meta"><div>No. Rujukan<br><b>' + esc(b.id) + '</b></div>' +
        '<div style="text-align:right;">Tarikh mohon: ' + esc(b.tarikhMohon) + '<br><span class="status s-' + esc(b.status) + '">' + esc(b.status) + '</span></div></div>' +
        '<h2>A. Maklumat Pemohon</h2>' + jadual([
          ['Nama', b.nama], ['Bahagian', b.bahagian], ['Unit', b.unit === '-' ? '' : b.unit], ['Emel', b.emel], ['No. telefon', b.noTelefon],
          ['Skim / gred', skimGred], ['Tujuan / program', b.tujuan],
          ['Bilangan orang (tidak termasuk PKA)', b.bilOrang ? b.bilOrang + ' orang' : '']
        ]) +
        '<h2>B. Butiran ' + (hotel ? 'Penginapan' : 'Penerbangan') + '</h2>' + jadual(butiran) +
        '<h2>C. Keputusan ' + esc(b.organisasi) + '</h2>' + jadual(keputusan) +
        (jadualLulus ? '<h2>D. Peringkat Kelulusan</h2>' + jadualLulus : '') +
        '<div class="sign"><div>Tandatangan Pemohon</div><div>Disahkan oleh (Nama, Jawatan &amp; Cop)</div></div>' +
        '<div class="foot">Dijana oleh ' + esc(b.appName) + '</div>';
    }
    muat();
  </script>
</body>
</html>
